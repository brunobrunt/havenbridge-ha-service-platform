---
# This role prepares the shared Kubernetes API endpoint.
#
# It does not activate the virtual IP.
# kube-vip activates 172.16.10.30 later.
#
# This role:
#   1. Adds k8s-api.lab to the cloud-init hosts template.
#   2. Adds k8s-api.lab to the active /etc/hosts file.
#   3. Confirms the hostname resolves to the expected VIP.
#   4. Confirms the kube-vip network interface exists.
#
# cloud-init was originally configured with:
#
#   manage_etc_hosts: true
#
# Therefore, /etc/hosts is regenerated from
# /etc/cloud/templates/hosts.debian.tmpl during every reboot.
# The endpoint must be added to both files.

- name: Add Kubernetes API endpoint to cloud-init hosts template
  become: true
  ansible.builtin.lineinfile:
    path: /etc/cloud/templates/hosts.debian.tmpl

    # Replace any old line containing k8s-api.lab.
    # This prevents duplicate or outdated endpoint entries.
    regexp: '^[^#]*\s+k8s-api\.lab(\s|$)'

    line: "{{ control_plane_vip }} {{ control_plane_endpoint_name }}"
    state: present
    create: false
    owner: root
    group: root
    mode: "0644"

- name: Add Kubernetes API endpoint to active hosts file
  become: true
  ansible.builtin.lineinfile:
    path: /etc/hosts

    # Replace any existing line containing k8s-api.lab.
    regexp: '^[^#]*\s+k8s-api\.lab(\s|$)'

    line: "{{ control_plane_vip }} {{ control_plane_endpoint_name }}"
    state: present
    create: true
    owner: root
    group: root
    mode: "0644"

- name: Check Kubernetes API name resolution
  ansible.builtin.command:
    argv:
      - getent
      - hosts
      - "{{ control_plane_endpoint_name }}"
  register: api_name_resolution
  changed_when: false
  when: not ansible_check_mode

- name: Check kube-vip network interface
  ansible.builtin.command:
    argv:
      - ip
      - link
      - show
      - "{{ kube_vip_interface }}"
  register: kube_vip_interface_status
  changed_when: false
  when: not ansible_check_mode

- name: Validate Kubernetes API endpoint preparation
  ansible.builtin.assert:
    that:
      - api_name_resolution.rc == 0
      - control_plane_vip in api_name_resolution.stdout
      - kube_vip_interface_status.rc == 0
    fail_msg: >-
      Kubernetes API endpoint preparation failed.
      Confirm that {{ control_plane_endpoint_name }} resolves to
      {{ control_plane_vip }} and that network interface
      {{ kube_vip_interface }} exists.
    success_msg: >-
      Kubernetes API endpoint preparation succeeded.
      {{ control_plane_endpoint_name }} resolves to
      {{ control_plane_vip }}, and interface
      {{ kube_vip_interface }} exists.
  when: not ansible_check_mode
