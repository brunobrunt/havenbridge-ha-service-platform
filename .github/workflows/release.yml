name: HavenBridge Release

on:
  workflow_dispatch:
#on:
#  push:
#    tags:
#      - 'v*.*.*'

permissions:
  #contents: read
  contents: write
  packages: write


jobs:
  release:
    name: Semantic Version Release
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: applications/havenbridge-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Determine next semantic version
        id: version
        run: bash "$GITHUB_WORKSPACE/cicd/scripts/next-version.sh"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-dev.txt

      - name: Run HavenBridge API tests
        run: python -m pytest

      - name: Build HavenBridge API Docker image
        run: |
          APP_VERSION="${{ steps.version.outputs.app_version }}"

          echo "Building HavenBridge API version ${APP_VERSION}"

          docker build \
            --build-arg APP_VERSION="${APP_VERSION}" \
            --tag havenbridge-api:release \
            .

      - name: Install Kubeconform
        run: |
          KUBECONFORM_VERSION="0.8.0"
          mkdir -p "$HOME/.local/bin"

          curl --fail --location --silent --show-error \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" kubeconform

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          "$HOME/.local/bin/kubeconform" -v

      - name: Validate HavenBridge Kubernetes manifests
        run: |
          kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.36.2 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "$GITHUB_WORKSPACE"/kubernetes/applications/havenbridge/backend/*.yaml

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag HavenBridge API release image
        run: |
          docker tag \
            havenbridge-api:release \
            ghcr.io/brunobrunt/havenbridge-api:${{ steps.version.outputs.tag }}

          docker tag \
            havenbridge-api:release \
            ghcr.io/brunobrunt/havenbridge-api:${GITHUB_SHA}

      - name: Push HavenBridge API release images
        run: |
          docker push \
            ghcr.io/brunobrunt/havenbridge-api:${{ steps.version.outputs.tag }}

          docker push \
            ghcr.io/brunobrunt/havenbridge-api:${GITHUB_SHA}

      - name: Create and push Git release tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "${TAG}" \
            -m "HavenBridge ${TAG}"

          git push origin "${TAG}"
