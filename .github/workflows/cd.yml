name: HavenBridge CD

on:
  workflow_run:
    workflows:
      - HavenBridge Release
    types:
      - completed

# No GitHub repository permissions are granted globally.
#
# The release-verification job receives read-only repository access so it can
# inspect Git tags. The self-hosted deployment job receives no repository
# permissions and authenticates to Kubernetes using its restricted kubeconfig.
permissions: {}

concurrency:
  group: havenbridge-production-deployment
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify Release Was Created

    # Continue only when HavenBridge Release completed successfully.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

    outputs:
      release_created: ${{ steps.release_check.outputs.release_created }}
      release_tag: ${{ steps.release_check.outputs.release_tag }}

    steps:
      - name: Validate release SHA
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release SHA: ${RELEASE_SHA}"
            exit 1
          fi

          echo "Release SHA: ${RELEASE_SHA}"

      - name: Checkout released commit and Git tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_SHA }}

      - name: Determine whether a semantic release tag exists
        id: release_check
        shell: bash
        run: |
          set -euo pipefail

          # Refresh tags so this job sees the tag created immediately before
          # HavenBridge Release completed.
          git fetch --force --tags origin

          TAG="$(
            git tag \
              --points-at "${RELEASE_SHA}" \
              --list 'v[0-9]*.[0-9]*.[0-9]*' \
              | sort -V \
              | tail -n 1
          )"

          if [[ -z "${TAG}" ]]; then
            echo "No semantic-version release tag exists for ${RELEASE_SHA}."
            echo "The Release workflow completed successfully without creating a release."
            echo "CD deployment is not required."

            echo "release_created=false" >> "$GITHUB_OUTPUT"
            echo "release_tag=" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          TAG_SHA="$(git rev-list -n 1 "${TAG}")"

          if [[ "${TAG_SHA}" != "${RELEASE_SHA}" ]]; then
            echo "Release tag verification failed."
            echo "Expected SHA: ${RELEASE_SHA}"
            echo "Tag SHA:      ${TAG_SHA}"
            exit 1
          fi

          echo "Semantic release found: ${TAG}"
          echo "Release commit: ${RELEASE_SHA}"

          echo "release_created=true" >> "$GITHUB_OUTPUT"
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy HavenBridge API

    needs:
      - verify-release

    # Deploy only when the successful Release workflow actually created a
    # semantic-version tag for the exact release commit.
    if: ${{ needs.verify-release.outputs.release_created == 'true' }}

    runs-on:
      - self-hosted
      - havenbridge-cd

    permissions: {}

    timeout-minutes: 10

    env:
      KUBECONFIG: /home/github-runner/.kube/config
      NAMESPACE: havenbridge
      DEPLOYMENT: havenbridge-api
      CONTAINER: havenbridge-api
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_TAG: ${{ needs.verify-release.outputs.release_tag }}

    steps:
      - name: Show CD runner identity
        run: |
          echo "Runner hostname: $(hostname)"
          echo "Runner user: $(whoami)"
          echo "Release tag: ${RELEASE_TAG}"
          echo "Release SHA: ${RELEASE_SHA}"

      - name: Validate release SHA
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release SHA: ${RELEASE_SHA}"
            exit 1
          fi

      - name: Verify Kubernetes access
        run: |
          kubectl get deployment "${DEPLOYMENT}" \
            -n "${NAMESPACE}"

      - name: Show currently deployed image
        run: |
          kubectl get deployment "${DEPLOYMENT}" \
            -n "${NAMESPACE}" \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="havenbridge-api")].image}{"\n"}'

      - name: Deploy released HavenBridge API image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/brunobrunt/havenbridge-api:${RELEASE_SHA}"

          echo "Deploying release ${RELEASE_TAG}"
          echo "Deploying image ${IMAGE}"

          kubectl set image \
            deployment/"${DEPLOYMENT}" \
            "${CONTAINER}"="${IMAGE}" \
            -n "${NAMESPACE}"

      - name: Wait for HavenBridge API rollout
        run: |
          kubectl rollout status \
            deployment/"${DEPLOYMENT}" \
            -n "${NAMESPACE}" \
            --timeout=180s

      - name: Verify deployed image
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="ghcr.io/brunobrunt/havenbridge-api:${RELEASE_SHA}"

          ACTUAL="$(kubectl get deployment "${DEPLOYMENT}" \
            -n "${NAMESPACE}" \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="havenbridge-api")].image}')"

          echo "Release tag:    ${RELEASE_TAG}"
          echo "Expected image: ${EXPECTED}"
          echo "Actual image:   ${ACTUAL}"

          if [[ "${ACTUAL}" != "${EXPECTED}" ]]; then
            echo "Deployment image verification failed."
            exit 1
          fi

          echo "HavenBridge deployment verification passed."
