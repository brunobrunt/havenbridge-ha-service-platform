name: HavenBridge CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: FastAPI Tests

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: applications/havenbridge-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Fetch Git history so CI can compare the previous and current commits.
          fetch-depth: 0

      - name: Detect HavenBridge API changes
        id: api_changes
        if: github.event_name == 'push'
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" \
            | grep -q '^applications/havenbridge-api/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "HavenBridge API changed"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "HavenBridge API did not change"
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-dev.txt

      - name: Run HavenBridge API tests
        run: python -m pytest

      - name: Build HavenBridge API Docker image
        run: docker build --tag havenbridge-api:ci .

      - name: Install Kubeconform
        run: |
          KUBECONFORM_VERSION="0.8.0"
          mkdir -p "$HOME/.local/bin"

          curl --fail --location --silent --show-error \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" kubeconform

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          "$HOME/.local/bin/kubeconform" -v

      - name: Validate HavenBridge Kubernetes manifests
        run: |
          kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.36.2 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "$GITHUB_WORKSPACE"/kubernetes/applications/havenbridge/backend/*.yaml

      # The following GHCR steps run only when:
      # 1. The event is a push.
      # 2. The push is to main.
      # 3. Something under applications/havenbridge-api/ changed.

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.api_changes.outputs.changed == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag HavenBridge API image for GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.api_changes.outputs.changed == 'true'
        run: |
          docker tag \
            havenbridge-api:ci \
            ghcr.io/brunobrunt/havenbridge-api:${GITHUB_SHA}

      - name: Push HavenBridge API image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.api_changes.outputs.changed == 'true'
        run: |
          docker push \
            ghcr.io/brunobrunt/havenbridge-api:${GITHUB_SHA}
