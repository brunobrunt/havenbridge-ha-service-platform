prometheus:
  enabled: true

  prometheusSpec:
    replicas: 1
    retention: 10d

    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi

grafana:
  enabled: true

  defaultDashboardsEnabled: true

  ingress:
    enabled: false

  # Provision Loki automatically as an additional Grafana datasource.
  #
  # Prometheus remains the default datasource for metrics.
  # Loki provides centralized Kubernetes and HavenBridge logs.
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://havenbridge-loki-gateway.observability.svc.cluster.local/
      access: proxy
      isDefault: false

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

alertmanager:
  enabled: true

  alertmanagerSpec:
    replicas: 1
    retention: 120h

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 100m
      memory: 30Mi
    limits:
      cpu: 200m
      memory: 50Mi
