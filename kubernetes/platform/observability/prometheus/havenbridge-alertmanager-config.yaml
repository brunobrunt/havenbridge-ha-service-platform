apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig

metadata:
  name: havenbridge-notifications
  namespace: observability

spec:
  route:
    receiver: havenbridge-notifications
    groupBy:
      - alertname
      - severity
    groupWait: 10s
    groupInterval: 5m
    repeatInterval: 4h

    matchers:
      - name: alertname
        matchType: =~
        value: "HavenBridge.*"

  receivers:
    - name: havenbridge-notifications

      discordConfigs:
        - apiURL:
            name: havenbridge-discord-webhook
            key: webhook-url

          sendResolved: true
          username: "HavenBridge Alertmanager"

          title: '{{ .CommonLabels.alertname }} - {{ .Status }}'

          message: |
            Severity: {{ .CommonLabels.severity }}

            {{ if eq .Status "firing" }}
            {{ range .Alerts }}
            Summary: {{ .Annotations.summary }}
            Description: {{ .Annotations.description }}
            {{ end }}
            {{ else if eq .CommonLabels.alertname "HavenBridgeAPIUnavailable" }}
            Summary: HavenBridge API availability restored
            Description: Prometheus can now detect healthy HavenBridge API scrape targets.
            {{ else if eq .CommonLabels.alertname "HavenBridgePostgreSQLConnectivityFailure" }}
            Summary: HavenBridge PostgreSQL Service connectivity restored
            Description: The PostgreSQL Service now has a Ready EndpointSlice backend and application connectivity has recovered.
            {{ else }}
            Summary: {{ .CommonLabels.alertname }} has recovered
            Description: The monitored condition has returned to a healthy state.
            {{ end }}

      slackConfigs:
        - apiURL:
            name: havenbridge-slack-webhook
            key: webhook-url

          sendResolved: true
          username: "HavenBridge Alertmanager"

          title: '{{ .CommonLabels.alertname }} - {{ .Status }}'

          text: |
            Severity: {{ .CommonLabels.severity }}

            {{ if eq .Status "firing" }}
            {{ range .Alerts }}
            *Summary:* {{ .Annotations.summary }}
            *Description:* {{ .Annotations.description }}
            {{ end }}
            {{ else if eq .CommonLabels.alertname "HavenBridgeAPIUnavailable" }}
            *Summary:* HavenBridge API availability restored
            *Description:* Prometheus can now detect healthy HavenBridge API scrape targets.
            {{ else if eq .CommonLabels.alertname "HavenBridgePostgreSQLConnectivityFailure" }}
            *Summary:* HavenBridge PostgreSQL Service connectivity restored
            *Description:* The PostgreSQL Service now has a Ready EndpointSlice backend and application connectivity has recovered.
            {{ else }}
            *Summary:* {{ .CommonLabels.alertname }} has recovered
            *Description:* The monitored condition has returned to a healthy state.
            {{ end }}
