# HavenBridge Grafana Alloy configuration.

# Grafana Alloy will collect logs and forward them to Loki.
# Alloy runs as a DaemonSet so that one Alloy Pod is placed on each
# Kubernetes node and collects Pod logs from that node.

controller:
  type: daemonset

  # Allow Alloy to run on the three Kubernetes control-plane nodes.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

rbac:
  create: true

  # Minimal read-only permissions required for Kubernetes Pod discovery.
  rules:
    - apiGroups: [""]
      resources:
        - pods
        - namespaces
      verbs:
        - get
        - list
        - watch

  # The Alloy chart appends clusterRules to the same ClusterRole.
  # Keep the Pod log permission here rather than using an empty list,
  # which causes invalid rendered YAML with this chart version.
  clusterRules:
    - apiGroups: [""]
      resources:
        - pods/log
      verbs:
        - get
        - list
        - watch


alloy:
  # NODE_NAME is populated by Kubernetes using the node on which
  # each Alloy Pod is running.
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

  configMap:
    content: |
      logging {
        level  = "info"
        format = "logfmt"
      }

      // Discover Kubernetes Pods, but only Pods running on the same
      // node as this Alloy DaemonSet Pod.
      discovery.kubernetes "pods" {
        role = "pod"

        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("NODE_NAME")
        }
      }

      // Convert useful Kubernetes metadata into Loki labels.
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }

        rule {
          target_label = "cluster"
          replacement  = "everpresence-haven"
        }
      }

      // Read Pod logs through the Kubernetes API.
      //
      // This approach does not require privileged access or host
      // filesystem mounts.
      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.write.havenbridge.receiver]
      }

      // Forward collected logs to the Loki gateway.
      loki.write "havenbridge" {
        endpoint {
          url = "http://havenbridge-loki-gateway.observability.svc.cluster.local/loki/api/v1/push"
        }
      }
