---
apiVersion: v1
kind: Pod
metadata:
  name: nfs-writer
  namespace: platform-validation

spec:
  nodeSelector:
    kubernetes.io/hostname: eph-worker02

  containers:
    - name: writer
      image: busybox:1.36.1

      env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName

      command:
        - /bin/sh
        - -c
        - |
          echo "Written by Pod $(hostname) on node ${NODE_NAME} at $(date)" \
            > /data/persistence-proof.txt
          sleep 3600

      volumeMounts:
        - name: shared-storage
          mountPath: /data

  volumes:
    - name: shared-storage
      persistentVolumeClaim:
        claimName: nfs-persistence-test
