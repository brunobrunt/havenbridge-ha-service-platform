# Creates the long-lived ServiceAccount token used by the external CD runner.
#
# The token value is NOT stored in this Git manifest.
# Kubernetes populates the token after this Secret is created.
#
# Security:
# - bound to the havenbridge-deployer ServiceAccount
# - permissions remain controlled by the havenbridge-deployer Role
# - the generated token must never be committed to Git

apiVersion: v1
kind: Secret
metadata:
  name: havenbridge-deployer-token
  namespace: havenbridge
  annotations:
    kubernetes.io/service-account.name: havenbridge-deployer
type: kubernetes.io/service-account-token
