apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: havenbridge-tls
  namespace: traefik
  labels:
    app.kubernetes.io/part-of: havenbridge
    app.kubernetes.io/component: tls
spec:
  secretName: havenbridge-tls

  dnsNames:
    - havenbridge.lab

  duration: 2160h
  renewBefore: 720h

  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always

  usages:
    - digital signature
    - key encipherment
    - server auth

  issuerRef:
    name: havenbridge-ca
    kind: ClusterIssuer
    group: cert-manager.io
