---
apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: havenbridge-postgres
  namespace: havenbridge

  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: havenbridge-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: havenbridge

spec:
  # The headless Service gives the StatefulSet Pod a stable DNS identity.
  serviceName: havenbridge-postgres-headless

  # Only one PostgreSQL instance is used at this stage.
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: havenbridge-postgres

  # Keep the database PVC if the StatefulSet is deleted or scaled down.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain

  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: havenbridge-postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: havenbridge

    spec:
      # Give PostgreSQL enough time to shut down cleanly.
      terminationGracePeriodSeconds: 120

      securityContext:
        # PostgreSQL runs with UID/GID 999 in the official image.
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch

        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: prepare-data-directory
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent

          # PostgreSQL 18 stores its files in a version-specific directory.
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /var/lib/postgresql/18/docker
              chown -R 999:999 /var/lib/postgresql
              chmod 0700 /var/lib/postgresql/18/docker

          securityContext:
            # Root is used only during this short initialization step.
            runAsUser: 0
            allowPrivilegeEscalation: false

            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql

      containers:
        - name: postgresql
          image: postgres:18.3
          imagePullPolicy: IfNotPresent

          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP

          # POSTGRES_DB and POSTGRES_USER come from the ConfigMap.
          envFrom:
            - configMapRef:
                name: havenbridge-postgres-config

          env:
            # The password is read from the mounted Kubernetes Secret.
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/postgres-password

            # PostgreSQL 18 uses a version-specific data directory.
            - name: PGDATA
              value: /var/lib/postgresql/18/docker

            # Require SCRAM authentication for network connections.
            - name: POSTGRES_HOST_AUTH_METHOD
              value: scram-sha-256

            # Enable checksums and SCRAM authentication during initialization.
            - name: POSTGRES_INITDB_ARGS
              value: --data-checksums --auth-host=scram-sha-256

          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false

            capabilities:
              drop:
                - ALL

          # Startup succeeds only when the HavenBridge database exists
          # and accepts a real SQL query.
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  psql \
                    -U "$POSTGRES_USER" \
                    -d "$POSTGRES_DB" \
                    -tAc 'SELECT 1' \
                    >/dev/null 2>&1

            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 180

          # Readiness confirms that the database required by the
          # HavenBridge application is usable.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  psql \
                    -U "$POSTGRES_USER" \
                    -d "$POSTGRES_DB" \
                    -tAc 'SELECT 1' \
                    >/dev/null 2>&1

            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Liveness checks whether the PostgreSQL server is responding.
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  pg_isready \
                    -q \
                    -U "$POSTGRES_USER" \
                    -d template1

            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6

          resources:
            requests:
              cpu: 250m
              memory: 512Mi

            limits:
              cpu: "1"
              memory: 1Gi

          volumeMounts:
            # Persistent PostgreSQL data.
            - name: postgres-data
              mountPath: /var/lib/postgresql

            # PostgreSQL password from the Kubernetes Secret.
            - name: postgres-secret
              mountPath: /run/secrets
              readOnly: true

            # Memory-backed shared-memory directory for PostgreSQL.
            - name: dshm
              mountPath: /dev/shm

      volumes:
        - name: postgres-secret
          secret:
            secretName: havenbridge-postgres-secret
            defaultMode: 0440

            items:
              - key: POSTGRES_PASSWORD
                path: postgres-password

        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi

  # The StatefulSet automatically creates one PVC for each PostgreSQL Pod.
  volumeClaimTemplates:
    - metadata:
        name: postgres-data

        labels:
          app.kubernetes.io/name: postgresql
          app.kubernetes.io/instance: havenbridge-postgres
          app.kubernetes.io/component: database
          app.kubernetes.io/part-of: havenbridge

      spec:
        # Only one PostgreSQL Pod should mount this database volume.
        accessModes:
          - ReadWriteOnce

        storageClassName: havenbridge-nfs

        resources:
          requests:
            storage: 10Gi
