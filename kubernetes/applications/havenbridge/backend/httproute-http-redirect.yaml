apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: havenbridge-http-redirect
  namespace: havenbridge
  labels:
    app.kubernetes.io/name: havenbridge-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: havenbridge
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: havenbridge-gateway
      namespace: traefik
      sectionName: web

  hostnames:
    - havenbridge.lab

  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
