apiVersion: batch/v1
kind: Job
metadata:
  name: api-egress-negative-test
  namespace: havenbridge
  labels:
    app.kubernetes.io/component: networkpolicy-test
    app.kubernetes.io/part-of: havenbridge

spec:
  backoffLimit: 0

  template:
    metadata:
      labels:
        app.kubernetes.io/name: havenbridge-api
        app.kubernetes.io/component: networkpolicy-test
        app.kubernetes.io/part-of: havenbridge

    spec:
      restartPolicy: Never
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: egress-test
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent

          command:
            - sh
            - -c

          args:
            - |
              echo "Testing an egress destination that is not allowed"
              echo
              echo "Destination:"
              echo "http://kube-dns.kube-system.svc.cluster.local:9153/metrics"
              echo

              if wget \
                --timeout=5 \
                --tries=1 \
                --output-document=- \
                http://kube-dns.kube-system.svc.cluster.local:9153/metrics
              then
                echo
                echo "UNEXPECTED: CoreDNS metrics port 9153 was reachable."
                exit 1
              else
                echo
                echo "EXPECTED: NetworkPolicy blocked TCP port 9153."
                exit 0
              fi

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - exit 1
            periodSeconds: 2
            failureThreshold: 1

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
