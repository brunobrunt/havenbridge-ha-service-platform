####    allow-havenbridge-api-egress
###   → controls outgoing API traffic

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-havenbridge-api-egress
  namespace: havenbridge
  labels:
    app.kubernetes.io/name: havenbridge-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: havenbridge

spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: havenbridge-api

  policyTypes:
    - Egress

  egress:
    # Allow the API Pods to use Kubernetes DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns

      ports:
        - protocol: UDP
          port: 53

        - protocol: TCP
          port: 53

    # Allow the API Pods to connect to PostgreSQL.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: havenbridge
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: havenbridge-postgres
              app.kubernetes.io/name: postgresql

      ports:
        - protocol: TCP
          port: 5432
