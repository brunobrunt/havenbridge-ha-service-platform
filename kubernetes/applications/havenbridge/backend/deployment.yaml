apiVersion: apps/v1
kind: Deployment
metadata:
  name: havenbridge-api
  namespace: havenbridge
  labels:
    app.kubernetes.io/name: havenbridge-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: havenbridge
spec:
  replicas: 2

  revisionHistoryLimit: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
        # maxSurge: 1
        #maxUnavailable: 0

  selector:
    matchLabels:
      app.kubernetes.io/name: havenbridge-api

  template:
    metadata:
      labels:
        app.kubernetes.io/name: havenbridge-api
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: havenbridge

          #    spec:
          #      securityContext:
          #        runAsNonRoot: true
          #        seccompProfile:
          #          type: RuntimeDefault
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
            # whenUnsatisfiable: ScheduleAnyway
            #whenUnsatisfiable: DoNotScheduleScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: havenbridge-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: havenbridge-api
          image: ghcr.io/brunobrunt/havenbridge-api:0.1.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: havenbridge-api-config

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true

          volumeMounts:
            - name: postgres-password
              mountPath: /run/secrets/postgres-password
              subPath: POSTGRES_PASSWORD
              readOnly: true

            - name: temporary-files
              mountPath: /tmp

          readinessProbe:
            httpGet:
              #            path: /health
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              #           path: /health
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

      volumes:
        - name: postgres-password
          secret:
            secretName: havenbridge-postgres-secret
            items:
              - key: POSTGRES_PASSWORD
                path: POSTGRES_PASSWORD

        - name: temporary-files
          emptyDir: {}
